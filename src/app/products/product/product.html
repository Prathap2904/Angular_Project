<div class="products-page">
  <div class="container mt-4">

    <h2 class="mb-4 text-center">Products</h2>

    <!-- Filters -->
    <div class="row mb-4 filter-box align-items-end">
      <div class="col-md-4">
        <label class="form-label">Search</label>
        <input
          type="text"
          class="form-control"
          placeholder="Search product"
          [(ngModel)]="searchText"
          (input)="filterProducts()"
        />
      </div>

      <div class="col-md-4">
        <label class="form-label">Category</label>
        <select
          class="form-control"
          [(ngModel)]="selectedCategory"
          (change)="filterProducts()"
        >
          <option value="">All Categories</option>
          <option *ngFor="let c of categories" [value]="c">
            {{ c }}
          </option>
        </select>
      </div>

      <div class="col-md-4">
        <label class="form-label">
          Max Price: ₹ {{ maxPrice }}
        </label>
        <input
          type="range"
          class="form-range"
          min="0"
          max="1000"
          [(ngModel)]="maxPrice"
          (change)="filterProducts()"
        />
      </div>
    </div>

    <!-- Products -->
    <div class="row">
      <div
        class="col-md-3 mb-4"
        *ngFor="let product of filteredProducts"
      >
        <div class="card product-card h-100">
          <img
            [src]="product.image"
            class="card-img-top product-image"
            alt="{{ product.title }}"
          />

          <div class="card-body text-center">
            <h6 class="card-title">
              {{ product.title }}
            </h6>
            <p class="price">
              ₹ {{ product.price }}
            </p>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
